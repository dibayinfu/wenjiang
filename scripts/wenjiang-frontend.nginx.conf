# deploy.sh 首次部署时安装到 /etc/nginx/conf.d/wenjiang.mozi365.com.conf。
# 域名需指向服务器，且下列证书需覆盖 wenjiang.mozi365.com。
server {
    listen 80;
    server_name wenjiang.mozi365.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wenjiang.mozi365.com;
    ssl_certificate /etc/nginx/ssl/mozi365.com/mozi365.com.pem;
    ssl_certificate_key /etc/nginx/ssl/mozi365.com/mozi365.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /data/wenjiang/frontend/current;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 项目使用 Hash 路由；API 仍直接访问现有 car.r10iot.com。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
