# deploy.sh 首次部署时安装到 /etc/nginx/conf.d/wenjiang-frontend.conf。
# 独立 IP 访问，与基于其他域名的虚拟主机共用 80 端口。
server {
    listen 80;
    server_name 156.238.249.157;
    root /data/wenjiang/frontend/current;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 项目使用 Hash 路由；API 仍直接访问现有 car.r10iot.com。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
